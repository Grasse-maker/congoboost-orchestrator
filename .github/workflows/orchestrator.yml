name: Orchestrateur Cloud Congoboost
on:
  schedule:
    - cron: '0 * * * *' # S'exécute toutes les heures
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Exécuter l'Orchestrateur
        run: python agent_organizer.py
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbyuISpIUfYCRElys3ZxvENsFQDsh1O7yP239QSyGm1k9LUSxZQakv8kq-VzAwPO0Ho/exec"
