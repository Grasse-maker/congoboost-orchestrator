<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Reçue | Agentcy Enterprise</title>
    <link rel="stylesheet" href="styles.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.05) 0px, transparent 50%),
                        #fff;
        }
        .success-card {
            max-width: 500px;
            padding: 60px 40px;
            background: white;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 40px 100px rgba(0,0,0,0.05);
        }
        .check-icon {
            width: 80px;
            height: 80px;
            background: #f0fdf4;
            color: #15803d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="check-icon">✓</div>
        <h2 style="margin-bottom: 20px;">L'Architecte a reçu votre message.</h2>
        <p style="color: #64748b; margin-bottom: 40px;">Votre demande de modernisation est en cours de traitement. Un consultant reviendra vers vous très prochainement via WhatsApp.</p>
        <a href="index.html" class="btn btn-dark">Retour à l'accueil</a>
    </div>
</body>
</html>
